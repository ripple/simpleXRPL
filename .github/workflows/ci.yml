name: CI

on:
  push:
    branches: [main]
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # npm 11 (bundled with Node 24) can crash `npm ci` with "Exit handler
      # never called!"; pin to npm 10 for a reliable install.
      - name: Pin npm to v10
        run: npm i -g npm@10 --registry=https://registry.npmjs.org
      - run: npm ci
      # Generated custodian types are committed; regenerate and fail if they're
      # stale relative to the vendored specs.
      - name: Verify generated types are up to date
        run: |
          npm run typegen
          git diff --exit-code src/generated \
            || (echo "::error::src/generated is stale — run 'npm run typegen' and commit." && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Pin npm to v10
        run: npm i -g npm@10 --registry=https://registry.npmjs.org
      - run: npm ci
      - run: npm test

  # Live testnet tier — required on every PR: proving the real ledger round-trip
  # is worth more than the occasional faucet/testnet flake. Runs serially via
  # --runInBand.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Pin npm to v10
        run: npm i -g npm@10 --registry=https://registry.npmjs.org
      - run: npm ci
      - run: npm run test:integration

  # Live custodian contract tests (Ripple Custody, Palisade, AWS KMS) — gated on
  # sandbox credentials supplied via repository/environment secrets. Runs only on
  # merge to main, tags/releases, and manual dispatch — NOT on PRs (fork PRs don't
  # get secrets, and we don't want an external sandbox gating every PR).
  #
  # Suites self-skip when their credentials are absent so the tier stays runnable
  # on a laptop, but CONTRACT_REQUIRE_ALL turns that into a hard failure here:
  # all three backends are configured, so a skip means something broke.
  contract-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to mint the OIDC token that the AWS role assumption below
      # exchanges for short-lived credentials. `contents: read` is otherwise the
      # default, and must be restated once `permissions` is set explicitly.
      id-token: write
      contents: read
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Pin npm to v10
        run: npm i -g npm@10 --registry=https://registry.npmjs.org
      - run: npm ci
      # Short-lived credentials via OIDC. The role trusts only this repo's own
      # branches and tags, and can do nothing beyond GetPublicKey/Sign on the
      # single contract-test KMS key — so no long-lived AWS keys in secrets.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CONTRACT_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Run custodian contract tests
        env:
          # Every backend must actually run here. A self-skipping suite exits 0,
          # so without this a missing credential reports green with a whole
          # custodian left unexercised — which is how Ripple Custody sat un-run.
          CONTRACT_REQUIRE_ALL: '1'
          RIPPLE_CUSTODY_GATEWAY_URL: ${{ secrets.RIPPLE_CUSTODY_GATEWAY_URL }}
          RIPPLE_CUSTODY_AUTH_SIGNING_KEY: ${{ secrets.RIPPLE_CUSTODY_AUTH_SIGNING_KEY }}
          RIPPLE_CUSTODY_AUTH_TOKEN_URL: ${{ secrets.RIPPLE_CUSTODY_AUTH_TOKEN_URL }}
          RIPPLE_CUSTODY_AUTH_CLIENT_ID: ${{ secrets.RIPPLE_CUSTODY_AUTH_CLIENT_ID }}
          RIPPLE_CUSTODY_AUTH_PUBLIC_KEY: ${{ secrets.RIPPLE_CUSTODY_AUTH_PUBLIC_KEY }}
          RIPPLE_CUSTODY_DOMAIN_ID: ${{ secrets.RIPPLE_CUSTODY_DOMAIN_ID }}
          RIPPLE_CUSTODY_PRIMARY_ADDRESS: ${{ secrets.RIPPLE_CUSTODY_PRIMARY_ADDRESS }}
          PALISADE_BASE_URL: ${{ secrets.PALISADE_BASE_URL }}
          PALISADE_WALLETS_CLIENT_ID: ${{ secrets.PALISADE_WALLETS_CLIENT_ID }}
          PALISADE_WALLETS_CLIENT_SECRET: ${{ secrets.PALISADE_WALLETS_CLIENT_SECRET }}
          PALISADE_TX_CLIENT_ID: ${{ secrets.PALISADE_TX_CLIENT_ID }}
          PALISADE_TX_CLIENT_SECRET: ${{ secrets.PALISADE_TX_CLIENT_SECRET }}
          PALISADE_VAULT_ID: ${{ secrets.PALISADE_VAULT_ID }}
          PALISADE_WALLET_ID: ${{ secrets.PALISADE_WALLET_ID }}
          PALISADE_DEST_ADDRESS: ${{ secrets.PALISADE_DEST_ADDRESS }}
          AWS_KMS_KEY_ID: ${{ secrets.AWS_KMS_KEY_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: npm run test:contract
